 $('#detail').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>choose(b.dataset.id));$('#detail').querySelectorAll('[data-ability]').forEach(b=>b.onclick=()=>showAbilities(b.dataset.ability));
}
function draw(){const q=$('#query').value.trim().toLowerCase(),f=$('#module').value;let count=0,html='';for(const [i,m] of DATA.modules.entries()){if(f&&f!==m.name)continue;let groups='';for(const u of m.units){const ns=u.nodes.filter(n=>!q||[n.name,n.module,n.unit,n.description,n.id].some(t=>t.toLowerCase().includes(q)));if(!ns.length)continue;count+=ns.length;groups+=`<div class="unit"><h3>${esc(u.name)}</h3><div class="nodes">${ns.map(n=>`<button class="node ${n.id===selected?'active':''}" data-id="${n.id}"><span class="id">${n.id}</span>${esc(n.name)}</button>`).join('')}</div></div>`;}if(groups)html+=`<details class="module" ${q||f||expanded||i===0?'open':''}><summary><h2>${String(i+1).padStart(2,'0')} ${esc(m.name)}</h2><small>理论${m.theory} · 实践${m.practice} 学时</small></summary>${groups}</details>`;}$('#result').textContent=`显示 ${count} / ${DATA.nodes.length} 个知识点 · 点击节点查看关系`;$('#tree').innerHTML=html||'<div class="empty">没有匹配的知识点。</div>';$('#tree').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;document.querySelectorAll('.node.active').forEach(x=>x.classList.remove('active'));b.classList.add('active');details();});}
$('#query').oninput=draw;$('#module').onchange=draw;$('#expand').onclick=()=>{expanded=true;draw()};$('#collapse').onclick=()=>{expanded=false;document.querySelectorAll('details').forEach(d=>d.open=false)};draw();details();

function showKnowledge(){document.querySelector('#abilities').hidden=true;document.querySelector('#tree').hidden=false;document.querySelector('#result').hidden=false;document.querySelector('#knowledge-view').classList.add('current');document.querySelector('#ability-view').classList.remove('current');}
function showAbilities(id){
 document.querySelector('#abilities').hidden=false;document.querySelector('#tree').hidden=true;document.querySelector('#result').hidden=true;document.querySelector('#ability-view').classList.add('current');document.querySelector('#knowledge-view').classList.remove('current');
 document.querySelector('#abilities').innerHTML=DATA.abilities.map(a=>`<article class="ability-card" id="ability-${a.id}"><span class="badge">${a.id}</span><span class="badge">${esc(a.tag)}</span><h2>${esc(a.name)}</h2><p>${esc(a.description)}</p><h3>考核方式</h3><p>${esc(a.assessment)}</p><h3>成果与评价要点</h3><p>${esc(a.evidence)}</p><details ${id===a.id?'open':''}><summary>关联 ${a.knowledge_points.length} 个知识点</summary><div class="ref-list">${a.knowledge_points.map(name=>{const n=DATA.nodes.find(n=>n.name===name);return `<button data-knowledge="${n.id}">${esc(name)}</button>`}).join('')}</div></details></article>`).join('');
 document.querySelectorAll('[data-knowledge]').forEach(b=>b.onclick=()=>{showKnowledge();choose(b.dataset.knowledge);});
 if(id)document.querySelector('#ability-'+id).scrollIntoView({block:'start',behavior:'smooth'});
}
document.querySelector('#knowledge-view').onclick=showKnowledge;document.querySelector('#ability-view').onclick=()=>showAbilities();

</script></html>
